[package]
name = "playlist_yt"
version = "1.0.0"
edition = "2024"
description = "App de escritorio que crea playlists de YouTube con las canciones más populares de un cantante usando un agente de IA"
license = "MIT"
repository = "https://github.com/Deigo05/PlaylistYT"
readme = "README.md"

[[bin]]
name = "PlaylistYT"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
eframe = "0.37"
egui_extras = "0.37"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
toml = "0.9"
yup-oauth2 = "12"

[profile.release]
strip = true
